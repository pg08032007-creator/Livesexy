<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Izis Live</title>
  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#111;
      color:#fff;
      text-align:center;
    }
    .live{
      width:90%;
      max-width:400px;
      margin:20px auto;
      background:#222;
      border-radius:16px;
      padding:15px;
    }
    .video{
      background:#444;
      height:300px;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
    }
    .coins{
      margin:15px 0;
      font-size:18px;
    }
    button{
      margin:8px;
      padding:12px 18px;
      border:none;
      border-radius:10px;
      background:#ff4da6;
      color:white;
      font-size:16px;
      cursor:pointer;
    }
    #gifts{
      margin-top:15px;
      font-size:28px;
      min-height:40px;
    }
  </style>
</head>
<body>
  <div class="live">
    <h2>Izis Live</h2>
    <div class="video">AO VIVO</div>
    <div class="coins">Moedas: <span id="coins">100</span></div>

    <button onclick="sendGift('❤️',10)">❤️ (10)</button>
    <button onclick="sendGift('🌹',20)">🌹 (20)</button>
    <button onclick="sendGift('🚀',50)">🚀 (50)</button>

    <div id="gifts"></div>
  </div>

  <script>
    let coins = 100;

    function sendGift(emoji,cost){
      if(coins < cost){
        alert('Moedas insuficientes!');
        return;
      }
      coins -= cost;
      document.getElementById('coins').textContent = coins;
      document.getElementById('gifts').textContent += ' ' + emoji;
    }
  </script>
</body>
</html>

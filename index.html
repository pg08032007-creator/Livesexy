<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pijama Party - Live Streaming +18</title>
  <link rel="stylesheet" href="css/style.css">

</head>
<body>

  <!-- ================= TELA DE LOGIN / REGISTRO ================= -->
  <div class="welcome-card" id="authScreen">
    <h1 class="app-title">PIJAMA <span>PARTY</span></h1>
    <p class="subtitle" id="cardSubtitle">Assista ou transmita em tempo real</p>

    <!-- ETAPA 1: E-mail ou Anônimo -->
    <div class="step active" id="step1">
      <form class="auth-form" id="emailForm">
        <div class="input-group">
          <label for="email">Entrar com e-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required>
        </div>
        <button type="submit" class="btn btn-primary">Continuar com E-mail</button>
      </form>

      <div class="divider">
        <span>OU</span>
      </div>

      <button type="button" class="btn btn-anonymous" id="btnAnon">
        <svg class="mask-icon" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12c0 3.5 2.1 6.5 5.1 7.8l.9-1.8C5.8 17 4 14.7 4 12c0-4.4 3.6-8 8-8s8 3.6 8 8c0 2.7-1.8 5-4 6l.9 1.8c3-1.3 5.1-4.3 5.1-7.8 0-5.52-4.48-10-10-10zm-3.5 8c-1.38 0-2.5 1.12-2.5 2.5S7.12 15 8.5 15s2.5-1.12 2.5-2.5S9.88 10 8.5 10zm7 0c-1.38 0-2.5 1.12-2.5 2.5s1.12 2.5 2.5 2.5 2.5-1.12 2.5-2.5-1.12-2.5-2.5-2.5z"/>
        </svg>
        Entrar como Anônimo
      </button>
    </div>

    <!-- ETAPA 2: Dados +18 -->
    <div class="step" id="step2">
      <form class="auth-form" id="registerForm">
        <div class="input-group">
          <label for="username">Nome de Usuário</label>
          <input type="text" id="username" placeholder="@seu.nome" required>
        </div>

        <div class="input-group">
          <label for="gender">Gênero</label>
          <select id="gender" required>
            <option value="" disabled selected>Selecione seu gênero</option>
            <option value="Feminino">Feminino</option>
            <option value="Masculino">Masculino</option>
            <option value="Outro">Outro / Prefiro não dizer</option>
          </select>
        </div>

        <div class="input-group">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="••••••••" required minlength="6">
        </div>

        <label class="checkbox-group">
          <input type="checkbox" id="ageCheck" required>
          <span>Confirmar que tenho <span class="age-badge">+18</span> anos.</span>
        </label>

        <button type="submit" class="btn btn-primary">Entrar no App 🎈</button>
        <button type="button" class="btn btn-secondary" id="btnBack">← Voltar</button>
      </form>
    </div>
  </div>


  <!-- ================= TELA DA INTERFACE (FEED) ================= -->
  <div class="app-screen" id="appScreen">
    <div class="app-container">

      <!-- Header -->
      <div class="header">
        <div class="app-title" style="font-size: 1.3rem;">PIJAMA<span>PARTY</span></div>
        <div class="header-actions">
          <button class="icon-btn">
            <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
          </button>
          <button class="icon-btn">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          </button>
        </div>
      </div>

      <!-- Carrossel de Perfis Transmitindo -->
      <div class="stories-container" id="storiesContainer">
        <!-- Preenchido dinamicamente quando uma live inicia -->
      </div>

      <!-- Categorias -->
      <div class="section-header">
        <span class="section-title">Categorias</span>
        <a href="#" class="view-all">Ver tudo</a>
      </div>

      <div class="categories-bar">
        <button class="category-chip active">🔥 Em Alta</button>
        <button class="category-chip">💋 Privado 1v1</button>
        <button class="category-chip">🌙 Pijama Room</button>
        <button class="category-chip">⭐ Criadores VIP</button>
      </div>

      <!-- Grid de Lives Reais -->
      <div class="lives-grid" id="livesGrid">
        <div class="no-lives-msg" id="noLivesMsg">
          Nenhuma live acontecendo agora.<br>Clique no botão <strong>+</strong> abaixo para iniciar a primeira!
        </div>
      </div>

      <!-- Navbar Inferior -->
      <div class="navbar">
        <a href="#" class="nav-item active">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>Início</span>
        </a>
        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
          <span>Em Alta</span>
        </a>

        <!-- Botão Central: Iniciar Transmissão Real -->
        <button class="fab-btn" id="startLiveBtn" title="Iniciar Live">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>

        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
          <span>Chats</span>
        </a>
        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <span id="navProfileName">Perfil</span>
        </a>
      </div>

    </div>
  </div>

  <!-- LÓGICA JAVASCRIPT -->
  <script src="js/app.js"></script>

</body>
</html>
